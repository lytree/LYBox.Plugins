<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYBox.Plugin.ViteSample</title>

    <!--
      LYBox 宿主嵌入式 SDK（dev 经 Vite proxy，prod 直连宿主 /sdk/）。
      见 LYBox.Plugin.Shared.Web/Assets/lybox-plugin-sdk.js。

      为什么用内联脚本注入，而不是直接写 <script src> / <link>：
      Vite 构建期会把 index.html 里以 "/" 开头的静态资源当项目内文件解析，
      直接写会构建失败（Failed to resolve /sdk/lybox-plugin-sdk.js）。
      运行时注入让 Vite 完全忽略这两项，dev 与生产行为一致。

      为什么 SDK 必须是 type="module"：SDK 是 ES Module，以经典脚本加载会抛 SyntaxError。
    -->
    <script>
      (function () {
        var head = document.head;

        // 宿主 Fluent 主题变量（浅/深色由 data-lybox-theme 驱动）
        var theme = document.createElement('link');
        theme.rel = 'stylesheet';
        theme.href = '/sdk/lybox-plugin-theme.css';
        head.appendChild(theme);

        var sdk = document.createElement('script');
        sdk.type = 'module';
        sdk.src = '/sdk/lybox-plugin-sdk.js';
        head.appendChild(sdk);
      })();
    </script>

    <style>
      body {
        margin: 0;
        color: var(--lybox-color-text, #1a1a1a);
        background: var(--lybox-color-background, #f3f3f3);
      }
      main {
        font-family: var(--lybox-font-family, system-ui, sans-serif);
        max-width: 720px;
        margin: 48px auto;
        padding: 0 16px;
      }
      h1, h2 { color: var(--lybox-color-text, #1a1a1a); }
      p { color: var(--lybox-color-muted, #616161); line-height: 1.6; }
      input {
        padding: 6px 10px;
        border: 1px solid var(--lybox-color-border, #ccc);
        border-radius: var(--lybox-radius-control, 4px);
        background: var(--lybox-color-surface, #fff);
        color: var(--lybox-color-text, #1a1a1a);
      }
      button {
        padding: 6px 14px;
        border: none;
        border-radius: var(--lybox-radius-control, 4px);
        background: var(--lybox-color-primary, #005fb8);
        color: var(--lybox-color-on-primary, #fff);
        cursor: pointer;
      }
      button:hover { background: var(--lybox-color-primary-hover, #196ec1); }
      pre {
        background: var(--lybox-color-surface-alt, #f0f6ff);
        border: 1px solid var(--lybox-color-border-soft, #e3e6ea);
        border-radius: var(--lybox-radius-control, 4px);
        padding: 8px;
        font-size: 12px;
      }
      #events {
        list-style: none;
        padding: 8px;
        margin: 0;
        background: var(--lybox-color-surface-alt, #f9f9f9);
        border-radius: var(--lybox-radius-control, 4px);
        font-size: 12px;
      }
      #events li {
        padding: 2px 0;
        border-bottom: 1px solid var(--lybox-color-border-soft, #eee);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LYBox.Plugin.ViteSample 端到端演示</h1>
      <p id="env">检测运行环境…</p>
      <p id="ver">SDK 版本：检测中…</p>

      <h2>RPC 调用（生成器强类型客户端）</h2>
      <p>
        <input id="name" value="World" />
        <button id="btn-greet">GreetAsync</button>
        <span id="greet-result" style="margin-left: 12px"></span>
      </p>
      <p>
        <input id="a" type="number" value="3" style="width: 60px" />
        +
        <input id="b" type="number" value="5" style="width: 60px" />
        <button id="btn-add">AddAsync</button>
        <span id="add-result" style="margin-left: 12px"></span>
      </p>
      <p>
        <button id="btn-info">GetSampleInfoAsync</button>
      </p>
      <pre id="info-result"></pre>

      <h2>事件（C# → 前端 SSE）</h2>
      <ul id="events"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
